# Deploiement du backend DecoAR sur Render (Blueprint) : Render > New > Blueprint > ce depot.
# Les valeurs "sync: false" sont demandees a la creation (jamais ecrites dans Git).
services:
  - type: web
    name: decoar-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render gratuit bloque le SMTP (Gmail) : e-mails envoyes par l'API HTTP de Mailjet (ou Brevo)
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Service Python de reconnaissance faciale (ci-dessous) : URL https://decoar-face.onrender.com
      - key: FACE_SERVICE_URL
        sync: false
      - key: FACE_SERVICE_KEY
        sync: false

  # Reconnaissance faciale OpenCV (YuNet + SFace), appelee uniquement par decoar-api
  - type: web
    name: decoar-face
    runtime: python
    plan: free
    rootDir: face-service
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: gunicorn -w 1 --threads 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Meme valeur que FACE_SERVICE_KEY de decoar-api
      - key: FACE_SERVICE_KEY
        sync: false

  # Module M6 : Generation de modeles 3D (.glb) depuis une image via Hugging Face TRELLIS
  - type: web
    name: decoar-m6
    runtime: python
    plan: free
    rootDir: Backend_M6
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Token Hugging Face requis pour appeler l'espace trellis-community/TRELLIS
      - key: HF_TOKEN
        sync: false
